<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Het Sintelzegel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: één kolom, vaste HUD boven, scrollend verhaal midden, actiepaneel onder (duimbereik). */
:root{
  --bg:#121417; --panel:#1b1e23; --panel2:#24282f; --line:#363b45;
  --ink:#e4dccb; --mute:#958d7e; --ember:#e3893a; --ember2:#f2b35e;
  --hp:#b83c34; --mp:#3d72bf; --xp:#b8933a; --fa:#8a9099; --ma:#5f86b8;
  --good:#7fb86a; --bad:#d0614f;
  --r0:#b9b2a3; --r1:#7cc46d; --r2:#5aa0e6; --r3:#b77ce8; --r4:#f0a23a; --r5:#ef5d4f;
  --display:'IM Fell English SC', 'Palatino Linotype', Georgia, serif;
  --body:'Alegreya', 'Palatino Linotype', Georgia, serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top);background:var(--bg);border-left:1px solid #1d2026;border-right:1px solid #1d2026}
#hud{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px}
#hud:empty{display:none}
#main{flex:1 1 auto;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
#act{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:grid;gap:8px;max-height:48%;overflow-y:auto}
#act:empty{display:none}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0 0 .4em;text-wrap:balance;letter-spacing:.02em}
h1{font-size:2.3rem;line-height:1.05;color:var(--ember2)}
h2{font-size:1.5rem;color:var(--ember2)}
h3{font-size:1.15rem}
p{margin:0 0 .8em}
.mute{color:var(--mute)}
.small{font-size:.86rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stack{display:grid;gap:8px}
button{font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-height:44px;text-align:left;cursor:pointer;line-height:1.25;-webkit-tap-highlight-color:transparent}
button:hover:not(:disabled){border-color:#58606d}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button:disabled{opacity:.38;cursor:default}
button.pri{border-color:var(--ember);background:#2d241b;color:var(--ember2)}
button.sel{border-color:var(--ember2);box-shadow:inset 0 0 0 1px var(--ember2)}
button.c{text-align:center}
button .sub{display:block;font-size:.8rem;color:var(--mute);margin-top:2px}
input[type=text]{font:inherit;width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:#0e1013;color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--ember);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.sec{margin:18px 0 8px;font-family:var(--display);color:var(--mute);font-size:1rem;letter-spacing:.06em}
.bar{position:relative;height:9px;background:#0a0b0d;border-radius:5px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar.thin{height:5px}
.hudtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.88rem;margin-bottom:5px}
.hudtop b{font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--ember2)}
.hudbars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:.76rem;font-variant-numeric:tabular-nums;color:var(--mute)}
.badge{display:inline-block;min-width:1.3em;padding:0 .35em;border-radius:9px;background:var(--ember);color:#1a1209;font-size:.75rem;font-weight:700;text-align:center;margin-left:4px}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}.r5{color:var(--r5)}
.item{border-left:3px solid var(--line)}
.item.b0{border-left-color:var(--r0)}.item.b1{border-left-color:var(--r1)}.item.b2{border-left-color:var(--r2)}.item.b3{border-left-color:var(--r3)}.item.b4{border-left-color:var(--r4)}.item.b5{border-left-color:var(--r5)}
.item .nm{font-weight:700}
.item ul{margin:4px 0 0;padding-left:18px;font-size:.88rem}
.item .fx{font-style:italic;color:var(--ember2);font-size:.88rem;margin-top:4px}
.up{color:var(--good)}.down{color:var(--bad)}
.enemies{display:grid;gap:8px}
.foe{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.foe.tg{border-color:var(--ember2);box-shadow:0 0 0 1px var(--ember2)}
.foe .top{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.foe .top b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.foe.ally{cursor:default;border-color:#3d5b35}.foe.ally .top b{color:var(--good)}
.foe.boss .top b{color:var(--r5)} .foe.elite .top b{color:var(--r4)}
.foe .bars{display:grid;gap:3px;margin:6px 0 4px}
.foe .nums{font-size:.74rem;color:var(--mute);font-variant-numeric:tabular-nums;display:flex;gap:10px}
.intent{font-size:.84rem;color:var(--ember2);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:.72rem;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--mute)}
.chip.bad{border-color:#6b3a33;color:#e39a8c}.chip.good{border-color:#3d5b35;color:#a9d69a}.chip.tr{border-color:#6a5223;color:var(--r4)}
.log{margin-top:12px;font-size:.9rem;line-height:1.4;display:grid;gap:3px;align-content:start;max-height:34vh;overflow-y:auto;background:#0e1013;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.log div{color:var(--mute)}
.log div.new{color:var(--ink)}
.log .crit{color:var(--ember2);font-style:normal;font-weight:700}
.log .kill{color:var(--good)}
.log .boss{color:var(--r5);font-style:italic}
.log .hurt{color:#e39a8c}
.log .turn{color:#5c6370;font-size:.75rem;letter-spacing:.08em;margin-top:4px}
.prose{font-size:1.04rem}
.prose em{color:var(--ember2);font-style:italic}
.roll{font-variant-numeric:tabular-nums;background:#0e1013;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:10px 0;font-size:.92rem}
.roll .ok{color:var(--good);font-weight:700}.roll .no{color:var(--bad);font-weight:700}
.gain{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}
.gain li::before{content:"+ ";color:var(--ember)}
.gain li.neg::before{content:"− ";color:var(--bad)}
.node{display:grid;grid-template-columns:2.4em 1fr;gap:10px;align-items:center}
.sig{font-family:var(--display);font-size:1.5rem;text-align:center;color:var(--ember2);line-height:1}
.node.elite .sig{color:var(--r4)} .node.boss .sig{color:var(--r5)}
.prog{display:flex;gap:4px;margin:6px 0 14px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.d{background:var(--ember)} .prog i.b{background:#5a2a25}.prog i.b.d{background:var(--r5)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1;text-align:center;min-height:38px;padding:6px}
table.st{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.st td{padding:4px 0;border-bottom:1px solid #262a31}
table.st td:last-child{text-align:right}
.title{min-height:100%;display:flex;flex-direction:column;justify-content:center;position:relative}
.title canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.8}
.title .in{position:relative}
.title h1{font-size:3rem}
.tag{color:var(--mute);font-style:italic;margin-bottom:24px}
.lore{border-left:2px solid var(--ember);padding-left:12px;margin:10px 0;font-style:italic}
.lock{color:#545a64}
.lvlup{border:1px solid var(--ember);background:#251d15;color:var(--ember2);padding:8px 10px;border-radius:6px;margin:8px 0;font-family:var(--display)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <main id="main" tabindex="-1"></main>
  <nav id="act"></nav>
</div>
<script>
'use strict';
/* ============================================================
   HET SINTELZEGEL — tekst-RPG, single file, geen dependencies.
   ============================================================ */

// ---------- utils ----------
const $ = s => document.querySelector(s);
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const chance = p => Math.random() < p;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function wpick(o) { let tot = 0; for (const k in o) tot += o[k]; let r = Math.random() * tot; for (const k in o) { r -= o[k]; if (r <= 0) return k; } return Object.keys(o)[0]; }
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

const META_KEY = 'sintelzegel_meta_v1', RUN_KEY = 'sintelzegel_run_v1';
// localStorage kan ontbreken of gooien (sandbox/privémodus): spel blijft dan gewoon speelbaar zonder opslag.
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* geen opslag beschikbaar */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* idem */ } }
};

// ---------- data ----------
const DIFFS = [

  { n: 'Eeuwige Nacht', d: 'Alles wil je dood. De Holle Koning heeft een laatste gedaante.', hp: 3.1, dm: 2.05, loot: 4, trait: 1, camp: .5 }

};

const MATS = [[1, 'IJzeren', 'Koperen', 'Linnen'], [4, 'Stalen', 'Zilveren', 'Wollen'], [7, 'Aeldrische', 'Gouden', 'Zijden'], [10, 'Glazen', 'Maanstenen', 'Gewijde'], [13, 'Ebbenhouten', 'Sterrenstalen', 'Sterrengeweven'], [16, 'Sintelsmeed', 'Sintelsmeed', 'Sintelgeweven']];
const AFX = {

  dex: { l: 'Behendigheid', f: l => R(1, 2) + Math.floor(l * .45) },
  int: { l: 'Intelligentie', f: l => R(1, 2) + Math.floor(l * .45) },
  vit: { l: 'Vitaliteit', f: l => R(1, 2) + Math.floor(l * .45) },
  crit: { l: '% kritieke kans', p: 1, f: l => R(2, 4) + Math.floor(l / 6) },
  critdmg: { l: '% kritieke schade', p: 1, f: l => R(8, 15) + l },
  fa: { l: 'fysiek pantser', f: l => R(3, 6) + Math.floor(l * 1.8) },
  ma: { l: 'magisch pantser', f: l => R(3, 6) + Math.floor(l * 1.8) },

};

const LORE = {
  l1: ['Het Sintelzegel', 'Voordat er koningen waren, brandde in het hart van Valdoren een vuur dat niet van deze wereld was. De eerste mensen noemden het de Bron. Wie ervan dronk kon de wereld buigen: vuur uit de hand, storm uit de keel. Toen de Holle Koning de Bron voor zich alleen opeiste, smeedden zeven wachters er een zegel omheen. Zo eindigde het Eerste Tijdperk: niet met een overwinning, maar met een slot.'],
  l2: ['De Zeven Wachters', 'Zes wachters gaven hun leven om het zegel te sluiten. De zevende, wier naam uit elke kroniek is weggekrast, bleef achter om het te bewaken. Volgens de kloosters van het Grijswoud leeft zij voort in iedereen die met het teken in de handpalm wordt geboren. Volgens de priesters van Askroon is zij degene die het zegel ooit zal breken.'],
  l3: ['De Holle Koning', 'Morrath was de laatste koning van het oude Valdoren. Toen de pest zijn volk halveerde, ruilde hij zijn hart voor de belofte dat hij nooit zou sterven. Hij hield woord, en de belofte ook. Wat er in zijn borst achterbleef was leegte, en leegte heeft honger.'],
  l4: ['Zegeldragers', 'Eens per generatie wordt er een kind geboren met een ingebrand teken in de handpalm: zeven stralen rond een gesloten oog. Het teken wordt warm in de buurt van de Bron. Wanneer het zegel barst, brandt het. Jouw hand brandt al drie nachten.'],
  l5: ['Het Grijswoud', 'De houthakkers zeggen dat de wolven van het Grijswoud ooit de honden van de wachters waren. Ze bewaakten de wegen naar het zegel, zeven eeuwen lang. Sinds het zegel barst bewaken ze niets meer. Ze jagen.'],
  l6: ['De Grauwe Moeder', 'Ze was de eerste wolf die de Zevende Wachter tot zich riep, en de laatste die haar trouw bleef. Toen het zegel scheurde dronk ze van het lekkende sintelvuur. Haar ogen werden grijs, haar roedel werd een leger. Ze huilt naar een maan die alleen zij nog ziet.'],
  l7: ['De Verdronken Kust', 'Merrow was ooit de rijkste havenstad ten westen van de bergen. Toen de Holle Koning de zee opriep, opende de Priores de zeesluizen om zijn vloot te verdrinken. De vloot zonk. Merrow ook. Bij laag tij hoor je de klokken nog onder water luiden.'],
  l8: ['Het Gebed van de Priores', '"Neem mijn stad, Diepe Moeder, maar spaar het zegel." Dat waren haar laatste woorden, zo staat het op de kloostermuur. De Diepe Moeder nam de stad. Toen nam ze de Priores. Wat terugkwam uit het water bidt nog steeds, maar niet meer tot dezelfde god.'],
  l9: ['De Kraakpieken', 'De Jarls van het noorden zwoeren trouw aan wie de kou kon verdragen. Morrath kon dat; hij voelde niets meer. Zeven Jarls volgden hem in de oorlog. Zeven Jarls liggen begraven onder het ijs. Zeven Jarls zijn nooit helemaal gestorven.'],
  l10: ['Jarl Vorstbaard', 'Vorstbaard sloeg de Zesde Wachter het hoofd af op de Kraakbrug en werd beloond met eeuwig leven. Niemand vertelde hem dat eeuwig leven ook eeuwig koud is. In zijn grafheuvel zat hij rechtop op zijn troon, wachtend op een bevel dat nooit kwam.'],
  l11: ['Aeldrin', 'Het volk van Aeldrin bouwde in messing en stoom, en het begreep de Bron beter dan wie ook. Zij ontwierpen de machines die het zegel gesloten houden. Op een ochtend waren ze verdwenen, alle honderdduizend tegelijk, de soep nog warm op tafel. Hun machines werken nog steeds.'],
  l12: ['De Colossus', 'Aeldrische opschriften noemen hem "Sluiter". Hij werd gebouwd om het zegel dicht te houden, met een kern die gevoed wordt door het sintelvuur zelf. Nu het zegel lekt heeft hij meer kracht dan ooit, en zijn orders zijn eenvoudig: niemand komt erbij. Ook jij niet.'],
  l13: ['Askroon', 'Waar ooit de hoofdstad van Valdoren stond, ligt nu een vlakte van as die nooit afkoelt. In het midden staat de troon, nog altijd bezet. De as valt omhoog, alsof zelfs de grond hier weg wil.'],
  l14: ['Het Ledige', 'Het zegel was nooit van steen of messing. Het zegel was het hart van Morrath. De Zevende Wachter nam het uit zijn borst en sloot de Bron ermee af. Wie de Holle Koning werkelijk verslaat, geeft hem zijn hart terug, en daarmee de sleutel. Daarom werd de Zevende Wachter niet vergeten. Ze werd verzwegen.'],
  l15: ['Dagboek van een Dwaler', 'Dag 12. De wegwijzers wijzen allemaal naar het zuiden, ook die in het zuiden. Dag 14. Een kist die ademde. Ik heb hem niet geopend. Dag 15. Ik heb hem geopend.'],
  l16: ['Het Lied der Sirenen', 'De sirenen van Merrow zingen geen woorden. Ze zingen de namen van wie je verloren hebt, in de stem van die mensen zelf. Zeelieden stoppen was in hun oren. Weduwen niet.'],
  l17: ['Messing Opschrift', 'VERBODEN TOEGANG. SLUITER ACTIEF. BIJ BREUK VAN HET ZEGEL: ZOEK DE ZEVENDE. ZIJ DRAAGT DE SLEUTEL IN HAAR HAND.'],
  l18: ['De Prins van Ruil', 'Hij verschijnt aan reizigers op kruispunten, altijd glimlachend, altijd beleefd. Hij ruilt eerlijk, zegt hij. Hij heeft nooit gezegd in wiens voordeel.']

  if (old) S.p.bag.push(old);

// ---------- stadjes, bijmissies, eindkeuze ----------
const QUEST_MAX = 3;
// Missies: kort (verloopt bij het volgende stadje) of lang (loopt meerdere regio's).
// Beloning schaalt met de moeite (u). Aannemen kost een borg die je terugkrijgt bij succes.
function genQuests() {
  const r = S.reg + 1, reg = REGIONS[r];
  const g = 50 * (1 + r * .6), xpb = 35 * (r + 1);
  const tgt = pick(reg.pool), n = R(3, 5);
  const longUntil = Math.min(4, r + 2);
  const short = [
    { k: 'kill', target: tgt, goal: n, u: .25 * n, title: `Dood ${n}× ${EN[tgt].n}`, x: `"Ze hebben mijn ${pick(['broer', 'kudde', 'kar', 'zoon', 'hond'])} te pakken gehad, onderweg naar ${reg.n}."` },
    { k: 'elite', target: reg.elite, goal: 1, u: 1, title: `Versla ${EN[reg.elite].n}`, x: '"Er staat een prijs op dat hoofd. Een goede."' },
    { k: 'kist', goal: 3, u: .8, title: 'Open 3 kisten', x: `"In ${reg.n} ligt meer verborgen dan iemand durft te halen. Breng me verhalen, ik betaal."` },
    { k: 'worp', goal: 3, u: .7, title: 'Slaag voor 3 dobbelworpen', x: '"Ik wed dat je het niet kunt. Drie keer geluk, en je krijgt mijn inzet."' },
    { k: 'boss', goal: 1, u: 2, title: `Versla ${EN[reg.boss].n} zonder drankjes`, x: '"Iedereen wint met een tas vol drankjes. Laat zien wat je echt kunt."' }
  ].map(q => ({ ...q, until: r, long: false }));
  const ka = R(5, 7) * 4, kc = R(6, 8), kw = R(5, 7);
  const long = [
    { k: 'killany', goal: ka, u: ka * .09, title: `Versla ${ka} vijanden`, x: '"De wegen moeten weer veilig worden. Tel ze voor me."' },
    { k: 'kist', goal: kc, u: kc * .3, title: `Open ${kc} kisten`, x: '"Ik verzamel sloten. Breng me er genoeg, en je wordt rijk."' },
    { k: 'worp', goal: kw, u: kw * .25, title: `Slaag voor ${kw} dobbelworpen`, x: '"Geluk is een spier. Train hem."' },
    { k: 'elites', goal: 3, u: 2.6, title: 'Versla 3 elites', x: '"Drie kampioenen van de vijand. Breng me hun namen."' },
    { k: 'relic', goal: 1, u: 2.2, title: 'Vind een relikwie', x: '"Ergens tussen hier en Askroon ligt iets van de Wachters. Vind het, en ik betaal je wat het waard is."' }
  ].map(q => ({ ...q, until: longUntil, long: true }));
  const pickN = (a, k) => shuffle(a).slice(0, k);
  const repBonus = S.rep >= 3 ? 1 : 0, repMalus = S.rep <= -2 ? 1 : 0;
  const offers = [...pickN(short, 2 + repBonus - repMalus), ...pickN(long, 2)];
  const borgMul = 1 + Math.max(0, -S.rep) * .5;
  return offers.map(q => {
    const gold = Math.round(g * q.u), rw = { gold, xp: Math.round(xpb * q.u) };
    if (q.u >= .7) rw.item = Math.min(3, .6 + q.u * .6);
    if (q.k === 'boss') rw.relic = 1;
    return { ...q, who: pick(QUESTGIVERS), prog: 0, done: false, rew: rw, borg: Math.round(gold * .3 * borgMul) };
  });
}
const activeQuests = () => S.quests.filter(q => !q.done);
function questHook(kind, d) {
  for (const q of S.quests) {
    if (q.done) continue;
    let hit = false;
    if ((q.k === 'kill' || q.k === 'elite') && kind === 'kill' && d.id === q.target) hit = true;
    if (q.k === 'killany' && kind === 'kill') hit = true;
    if (q.k === 'elites' && kind === 'kill' && d.elite && !d.boss) hit = true;
    if (q.k === 'boss' && kind === 'kill' && d.boss && d.id === REGIONS[q.until].boss && !S.c.potUsed) hit = true;
    if (q.k === kind && (kind === 'kist' || kind === 'worp' || kind === 'relic')) hit = true;
    if (!hit) continue;
    q.prog++;
    if (q.prog >= q.goal) {
      q.done = true; S.rep++;
      const L = applyOut(q.rew);
      if (q.borg) { S.gold += q.borg; L.push(`borg terug: ${q.borg} goud`); }
      toast(`<b>Missie voltooid: ${q.title}</b><br>${L.join(' · ')}`);
    }
  }
}
function questFail(q, cancel) {
  S.quests = S.quests.filter(x => x !== q);
  S.rep -= cancel ? 2 : 1;
  if (!S.bless.includes('eedbreuk')) S.bless.push('eedbreuk');
  clampVitals();
}
function enterTown() {
  S.bless = S.bless.filter(b => b !== 'eedbreuk');
  const exp = S.quests.filter(q => !q.done && q.until <= S.reg);
  exp.forEach(q => questFail(q, false));
  S.quests = S.quests.filter(q => !q.done);
  S.town = { i: S.reg, tab: 'hub', spots: [], story: false, offers: genQuests(), stock: genStock(), rest: false, smith: 'wapen', school: CLASSES[S.p.cls].sc };
  S.screen = 'stad'; S.ctx = null;
  if (exp.length) toast(`<b>Missies mislukt:</b> ${exp.map(q => `${q.title} (borg ${q.borg} goud kwijt)`).join(', ')}.<br>Gebroken Eed: −10% schade en −25% goud tot het volgende stadje. Je reputatie daalt.`);
  save(); render();
}

  const rw = `${q.rew.gold} goud, ${q.rew.xp} ervaring${q.rew.relic ? ', een relikwie' : q.rew.item ? ', een ' + (q.rew.item >= 2.2 ? 'episch' : 'zeldzaam') + ' voorwerp' : ''}`;

}

// ---------- rendering ----------
let TOAST = null;
function toast(m) { TOAST = m; }
function bar(v, max, col, cls) { const p = max > 0 ? clamp(v / max, 0, 1) * 100 : 0; return `<div class="bar ${cls || ''}"><i style="width:${p}%;background:${col}"></i></div>`; }
function chips(st) { return Object.keys(st).map(k => `<span class="chip ${GOODST.includes(k) ? 'good' : 'bad'}">${STN[k]} ${st[k].t}</span>`).join(''); }
function setUI(main, act) { $('#main').innerHTML = main; $('#act').innerHTML = act || ''; }

function hud() {
  if (VIEW !== 'run' || !S || S.screen === 'einde') { $('#hud').innerHTML = ''; return; }
  const p = S.p, t = stats();
  const inC = S.screen === 'combat';
  $('#hud').innerHTML = `<div class="hudtop"><span><b>${esc(p.name)}</b> · ${CLASSES[p.cls].n} niv. ${p.lvl}</span><span>${S.gold} goud · ${p.cons.heal || 0}× drank</span></div>
  <div class="hudbars">
    <span>HP</span>${bar(p.hp, t.maxHp, 'var(--hp)')}<span>${Math.max(0, p.hp)}/${t.maxHp}</span>
    <span>MP</span>${bar(p.mp, t.maxMp, 'var(--mp)')}<span>${p.mp}/${t.maxMp}</span>
    ${inC ? `<span>Pantser</span><div class="grid2" style="gap:4px">${bar(p.fa, t.maxFa, 'var(--fa)', 'thin')}${bar(p.ma, t.maxMa, 'var(--ma)', 'thin')}</div><span>${p.fa}·${p.ma}</span>`
    : `<span>XP</span>${bar(p.xp, xpNeed(p.lvl), 'var(--xp)', 'thin')}<span>${p.xp}/${xpNeed(p.lvl)}</span>`}
  </div>${inC && Object.keys(p.st).length ? `<div class="chips">${chips(p.st)}</div>` : ''}`;
}

function render() {
  hud();
  if (VIEW === 'title') return rTitle();
  if (VIEW === 'create') return rCreate();
  if (OV === 'codex') return rCodex();
  if (S.ov) return ({ inv: rInv, char: rChar, skill: rSkillPick, quests: rQuests })[S.ov]();
  ({ regio: rRegio, map: rMap, combat: rCombat, buit: rBuit, event: rEvent, kist: rKist, shop: rShop, kamp: rKamp, schrijn: rSchrijn, einde: rEinde, stad: rStad, keuze: rKeuze })[S.screen]();
  if (TOAST) $('#main').insertAdjacentHTML('afterbegin', `<div class="card small" style="margin-bottom:10px;border-color:var(--ember)">${TOAST}</div>`);
}

  const fit = () => { cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; };
  fit();
  const ps = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), v: .0006 + Math.random() * .0015, r: .6 + Math.random() * 1.8, a: Math.random() }));
  const step = () => {
    if (!document.body.contains(cv)) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps) {
      p.y -= p.v; p.x += Math.sin((p.y + p.a) * 9) * .0006; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
      ctx.beginPath(); ctx.arc(p.x * cv.width, p.y * cv.height, p.r * devicePixelRatio, 0, 6.3);
      ctx.fillStyle = `rgba(240,${120 + Math.round(p.a * 80)},50,${.25 + .5 * (1 - p.y)})`; ctx.fill();
    }
    EMBER_RAF = requestAnimationFrame(step);
  };
  step();
}

      troon: `<h1>De Askoning</h1><p class="prose">Je zet het hart in je eigen borst. Het past, alsof er al die tijd plaats voor was. De as daalt eindelijk neer, en ze daalt op jouw schouders. De Askoerier knielt in de vlakte. "Majesteit." Valdoren heeft weer een koning die nooit zal sterven. Het voelt minder koud dan je dacht. Voorlopig.</p>`,
      vernietig: `<h1>De Dove Bron</h1><p class="prose">Je knijpt. Het hart breekt als een ei van obsidiaan. Overal in Valdoren doven de vuren die niet van deze wereld zijn. Het teken in je hand verbleekt tot een litteken. Ver weg in Laatste Licht gaat de lamp uit, en Zuster Ilse valt glimlachend tot stof. Er zal nooit meer magie zijn in Valdoren. Ook nooit meer een Holle Koning.</p>`,
      naam: `<h1>De Zevende</h1><p class="prose">Je spreekt haar naam uit: <em>Veridane</em>. Het hart in je handen wordt warm, dan heet, dan licht. Wat er van Morrath over is kijkt op. "Zo heette ze," zegt hij zacht. Je legt het hart terug in de Bron, niet als slot, maar als wond die mag helen. Het zegel sluit zich voorgoed. De Zevende Wachter heeft weer een naam, en jij draagt hem verder.</p>${c.d >= 5 ? '<p class="prose">Het Ledige trekt zich terug als een getij. Het heeft jouw gezicht niet meer. In de stilte daarna hoor je, heel ver weg, een wolvin huilen, een klok onder water luiden, en iemand lachen. Het is de eerste keer in drieduizend jaar dat de Zevende lacht.</p>' : ''}`
    };
    txt = E[c.end || 'herstel'] + (c.d >= 4 ? `<div class="lore">${LORE.l14[1]}</div>` : '') + (c.d <= 1 ? '<p class="small mute">Op Veteraan en hoger hoor je meer van dit verhaal en kun je anders kiezen.</p>' : `<p class="small mute">Eindes ontdekt: ${M.endings.length}/4</p>`);
  }
  setUI(`${txt}
  ${c.win && c.unlockedNow ? `<div class="lvlup">Nieuwe moeilijkheid ontgrendeld: ${DIFFS[Math.min(5, c.d + 1)].n}</div>` : ''}
  <div class="card"><table class="st">
    <tr><td>Held</td><td>${esc(s.name)}, ${CLASSES[s.cls].n}</td></tr>
    <tr><td>Moeilijkheid</td><td>${DIFFS[s.diff].n}</td></tr>
    <tr><td>Niveau</td><td>${s.lvl}</td></tr>
    <tr><td>Gekomen tot</td><td>${REGIONS[s.reg].n}</td></tr>
    <tr><td>Verslagen vijanden</td><td>${s.kills}</td></tr>
    <tr><td>Goud</td><td>${s.gold}</td></tr>
  </table></div>`, `<button class="pri c" data-a="endtitle">Naar het titelscherm</button>`);
}

// overlays
function rInv() {
  const p = S.p, tab = S.invTab || 'eq';
  let body;
  if (tab === 'eq') {
    body = `<div class="stack">${SLOTS.map(s => p.eq[s] ? itemCard(p.eq[s]) : `<div class="card mute small">${SLOTN[s]}: leeg</div>`).join('')}</div>`;
  } else if (tab === 'tas') {
    body = p.bag.length ? `<div class="stack">${p.bag.map(it => itemCard(it, `<button data-a="equip" data-v="${it.uid}">${it.slot === 'tome' ? 'Lezen' : 'Uitrusten'}</button><button data-a="scrap" data-v="${it.uid}">Ontmantel · ${Math.round(it.val * .4)} g</button>`, true)).join('')}</div>` : '<p class="mute">Je tas is leeg.</p>';
  } else {
    body = `<div class="stack">${Object.keys(CONS).map(k => `<div class="card row" style="justify-content:space-between;align-items:center"><span><b>${CONS[k].n}</b> ×${p.cons[k] || 0}<br><span class="small mute">${CONS[k].d}</span></span>${['heal', 'mana', 'elixer'].includes(k) ? `<button data-a="pot" data-v="${k}" ${p.cons[k] ? '' : 'disabled'}>Gebruik</button>` : ''}</div>`).join('')}</div>`;
  }
  setUI(`<h2>Uitrusting</h2><div class="tabs"><button class="${tab === 'eq' ? 'sel' : ''}" data-a="invtab" data-v="eq">Gedragen</button><button class="${tab === 'tas' ? 'sel' : ''}" data-a="invtab" data-v="tas">Tas ${p.bag.length}/${BAG_MAX}</button><button class="${tab === 'cons' ? 'sel' : ''}" data-a="invtab" data-v="cons">Voorraad</button></div>${body}`,
    `<button class="c" data-a="ovclose">Sluiten</button>`);
}
function rChar() {
  const p = S.p, t = stats();
  const attr = ['str', 'dex', 'int', 'vit'].map(k => `<tr><td>${STATN[k]}</td><td>${p[k]}${t[k] !== p[k] ? ` <span class="up">(${t[k]})</span>` : ''} ${p.pts ? `<button data-a="pt" data-v="${k}" style="min-height:32px;padding:2px 12px;margin-left:6px">+</button>` : ''}</td></tr>`).join('');
  setUI(`<h2>${esc(p.name)}</h2><p class="mute small">${CLASSES[p.cls].n} · ${SIGNS[p.sign].n} · niveau ${p.lvl} · ${DIFFS[S.diff].n}</p>
  ${p.pts ? `<div class="lvlup">${p.pts} attribuutpunt${p.pts > 1 ? 'en' : ''} te verdelen</div>` : ''}
  <div class="card"><table class="st">${attr}</table></div>
  <p class="small mute">Kracht: zware wapens, fysiek pantser. Behendigheid: lichte wapens, kritiek, ontwijken. Intelligentie: spreuken, MP, magisch pantser. Vitaliteit: HP.</p>
  <div class="sec">AFGELEID</div><div class="card"><table class="st">
    <tr><td>Max HP / MP</td><td>${t.maxHp} / ${t.maxMp}</td></tr>
    <tr><td>Wapenschade</td><td>${Math.round(t.wmin * (1 + t[t.wst] * .06))}–${Math.round(t.wmax * (1 + t[t.wst] * .06))} ${ELN[t.el]}</td></tr>
    <tr><td>Spreukkracht</td><td>${t.spell}</td></tr>
    <tr><td>Fysiek / magisch pantser</td><td>${t.maxFa} / ${t.maxMa}</td></tr>
    <tr><td>Kritieke kans / schade</td><td>${t.crit}% / +${t.critdmg + (t.fx.nachtdolk ? 40 : 0)}%</td></tr>
    <tr><td>Ontwijken</td><td>${t.dodge}%</td></tr>
    <tr><td>Levensroof</td><td>${t.ls}%</td></tr>
    <tr><td>MP-herstel per beurt</td><td>${t.mpr}</td></tr>
    <tr><td>Extra schade</td><td>${t.dmgPct}%</td></tr>
  </table></div>
  <div class="sec">VAARDIGHEDEN</div><div class="stack">${p.skills.map(id => `<div class="card"><b>${SK[id].n}</b> <span class="small mute">${mpCost(SK[id], t)} MP${SK[id].cd ? ` · wacht ${SK[id].cd}` : ''}</span><div class="small">${SK[id].d}</div></div>`).join('')}</div>
  <div class="sec">GEBOORTETEKEN EN ZEGENINGEN</div><div class="stack"><div class="card small"><b>${SIGNS[p.sign].n}</b>: ${SIGNS[p.sign].d}${p.sign === 'feniks' ? ` (${p.revive ? 'nog beschikbaar' : 'gebruikt'})` : ''}</div>${S.bless.map(b => `<div class="card small"><b class="${BLESS[b].curse ? 'down' : 'up'}">${BLESS[b].n}</b>: ${BLESS[b].d}</div>`).join('')}</div>
  <div class="sec">COMBINATIES</div><div class="card small">
    Nat + bliksem: +50% en verdoofd · Nat + ijs: bevroren · Vuur op nat: stoom (75% schade, verblind)<br>
    Olie + vuur: ontploffing + brand · Gif + vuur: het gif ontbrandt · Bevroren + fysiek: verbrijzeld (+50%)<br>
    Verblind: 50% kans om te missen · Wind slaat neer zonder magisch pantser · Lijken voeden necromantie<br>Verdoven, bevriezen en neerslaan werken pas als het passende pantser op is, en onderbreken opgeladen aanvallen.
  </div>`, `<button class="c" data-a="ovclose">Sluiten</button>`);
}
function rSkillPick() {
  const p = S.p;
  if (!S.pickOpts) { let pool = CLASSES[p.cls].pool.filter(k => !p.skills.includes(k) && canLearn(k)); if (!pool.length) pool = Object.keys(SK).filter(k => !p.skills.includes(k) && SK[k].sc !== 'univ' && canLearn(k)); S.pickOpts = shuffle(pool).slice(0, 3); save(); }
  const opts = S.pickOpts;
  setUI(`<h2>Nieuwe vaardigheid</h2><p class="prose mute">Het teken in je hand gloeit. Er opent zich iets.</p>
  <div class="stack">${opts.length ? opts.map(k => `<button data-a="learn" data-v="${k}"><b>${SK[k].n}</b> <span class="small mute">${SCHOOLS[SK[k].sc]} · ${SK[k].mp} MP${SK[k].cd ? ` · wacht ${SK[k].cd}` : ''}</span><span class="sub">${SK[k].d}</span></button>`).join('') : `<button data-a="learn" data-v="">Geen nieuwe vaardigheid op jouw niveau<span class="sub">Neem 2 attribuutpunten, of kies later (sterke spreuken komen vanaf niveau 5, 7, 9 en 12)</span></button>`}</div>`,
    `<button class="c" data-a="ovclose">Later kiezen</button>`);
}
function rCodex() {
  const tab = OVT;
  let body;
  if (tab === 'eind') {
    body = Object.keys(ENDINGS).map(k => M.endings.includes(k) ? `<div class="card"><h3>${ENDINGS[k].n}</h3><p class="small" style="margin:0">${ENDINGS[k].d}</p></div>` : `<div class="card lock small">??? · nog niet bereikt${ENDINGS[k].need ? ' (vanaf Veteraan)' : ''}</div>`).join('');
  } else if (tab === 'lore') {
    body = Object.keys(LORE).map(k => M.lore.includes(k) ? `<div class="card"><h3>${LORE[k][0]}</h3><p class="small" style="margin:0">${LORE[k][1]}</p></div>` : `<div class="card lock small">??? · nog niet gevonden</div>`).join('');
  } else if (tab === 'rel') {
    body = Object.keys(RELICS).map(k => { const R0 = RELICS[k]; return M.relics.includes(k) ? `<div class="card item b5"><div class="nm r5">${R0.n}</div><div class="small mute">${SLOTN[R0.slot]}</div>${R0.fxd ? `<div class="fx">${R0.fxd}</div>` : ''}<div class="small mute" style="font-style:italic">${R0.d}</div></div>` : `<div class="card lock small">??? · ${SLOTN[R0.slot]}</div>`; }).join('');
  } else {
    body = `<div class="card"><table class="st">
      <tr><td>Tochten begonnen</td><td>${M.runs}</td></tr><tr><td>Gestorven</td><td>${M.deaths}</td></tr>
      <tr><td>Vijanden verslagen</td><td>${M.kills}</td></tr><tr><td>Hoogste niveau</td><td>${M.best}</td></tr>
      ${DIFFS.map((d, i) => `<tr><td>${i < M.unlocked ? d.n : 'Vergrendeld'}</td><td>${M.wins[i] ? `${M.wins[i]}× uitgespeeld` : '–'}</td></tr>`).join('')}
    </table></div>`;
  }
  setUI(`<h2>Boekerij</h2><div class="tabs"><button class="${tab === 'lore' ? 'sel' : ''}" data-a="cxtab" data-v="lore">Pagina's ${M.lore.length}/${Object.keys(LORE).length}</button><button class="${tab === 'rel' ? 'sel' : ''}" data-a="cxtab" data-v="rel">Relikwieën ${M.relics.length}/${Object.keys(RELICS).length}</button><button class="${tab === 'eind' ? 'sel' : ''}" data-a="cxtab" data-v="eind">Eindes ${M.endings.length}/4</button><button class="${tab === 'ere' ? 'sel' : ''}" data-a="cxtab" data-v="ere">Erelijst</button></div><div class="stack">${body}</div>`,
    `<button class="c" data-a="cxclose">Sluiten</button>`);
}
let MENU_CONFIRM = false;
function rMenuInline() {
  setUI(`<h2>Menu</h2><p class="prose">Je voortgang wordt automatisch bewaard na elke stap.</p>${MENU_CONFIRM ? '<p class="down">Weet je het zeker? Deze tocht gaat definitief verloren.</p>' : ''}`,
    `<div class="stack"><button class="c" data-a="totitle">Naar het titelscherm</button><button class="c" data-a="abandon">${MENU_CONFIRM ? 'Ja, geef de tocht op' : 'Tocht opgeven'}</button><button class="pri c" data-a="tomap">Terug</button></div>`);
}

// ---------- acties ----------
const ACT = {
  new: () => { CR = { name: CR ? CR.name : 'Aveline', cls: 'krijger', sign: 'beer', diff: Math.min(1, M.unlocked - 1), heir: '' }; VIEW = 'create'; },
  cont: () => { VIEW = 'run'; },
  title: () => { VIEW = 'title'; },
  codex: () => { OV = 'codex'; if (VIEW === 'title') VIEW = 'codexview'; },
  cxtab: v => { OVT = v; },
  cxclose: () => { OV = null; if (VIEW === 'codexview') VIEW = 'title'; },
  ccls: v => { CR.cls = v; }, csign: v => { CR.sign = v; }, cdiff: v => { if (+v < M.unlocked) CR.diff = +v; }, cheir: v => { CR.heir = v; },
  start: () => { const n = (CR.name || '').trim().slice(0, 20) || 'Naamloze'; newRun({ ...CR, name: n }); VIEW = 'run'; },
  tomap: () => { if (S.screen === 'regio' || S.screen === 'kist' || S.screen === 'shop' || S.screen === 'kamp' || S.screen === 'schrijn' || S.screen === 'map') { MENU_CONFIRM = false; S.ov = null; toMap(); } },
  node: v => enterNode(+v),
  tgt: v => { S.c.target = +v; },
  atk: () => pAction('atk'), def: () => pAction('def'), flee: () => pAction('flee'),
  skill: v => pAction('skill', v), bomb: v => pAction('bomb', v),
  sub: v => { S.c.sub = v || null; },
  pot: v => usePotion(v),
  buitnext: () => { const n = S.ctx.next; if (n === 'victory') endChoice(); else if (n === 'region') enterTown(); else if (n === 'town') backTown(); else toMap(); },
  back: () => { if (S.ctx && S.ctx.ret) backTown(); else toMap(); },
  ending: v => victory(v),
  ttab: v => { S.town.tab = v; },
  tstory: () => { S.town.story = true; S.screen = 'event'; S.ctx = { id: `st${S.town.i}${tier()}`, res: null, ret: 'town' }; },
  tspot: v => { if (S.town.spots.includes(+v)) return; S.town.spots.push(+v); S.screen = 'event'; S.ctx = { id: `sp${S.town.i}${v}`, res: null, ret: 'town' }; },
  tshop: () => { S.screen = 'shop'; S.ctx = { tab: 'koop', ret: 'town' }; },
  trest: () => { const cost = 10 * (S.town.i + 1); if (S.town.rest || S.gold < cost) return; S.gold -= cost; S.town.rest = true; const t = stats(); S.p.hp = t.maxHp; S.p.mp = t.maxMp; toast('Je slaapt als een blok. HP en MP volledig hersteld.'); },
  tsmith: v => { S.town.smith = v; },
  tup: () => { const it = S.p.eq[S.town.smith]; if (!it || it.slot === 'amulet' || it.slot === 'ring' || (it.up || 0) >= 5) return; const cst = smithCost(it).up; if (S.gold < cst) return; S.gold -= cst; it.up = (it.up || 0) + 1; toast(`${esc(it.n)} is nu +${it.up}.`); },
  treroll: () => { const it = S.p.eq[S.town.smith]; if (!it || it.relic || it.r < 1) return; const cst = smithCost(it).rr; if (S.gold < cst) return; S.gold -= cst; const n = Object.keys(it.afx).length; it.afx = {}; rollAffixes(it, n); clampVitals(); toast('De smid hamert, gloeit en hamert opnieuw. Nieuwe eigenschappen.'); },
  tschool: v => { S.town.school = v; },
  tlearn: v => { const pr = trainPrice(v); if (S.gold < pr || S.p.skills.includes(v) || !canLearn(v)) return; S.gold -= pr; S.p.skills.push(v); toast(`Je leert ${SK[v].n}.`); },
  taccept: v => { const q = S.town.offers[+v]; if (!q || activeQuests().length >= QUEST_MAX || S.gold < q.borg) return; S.gold -= q.borg; S.town.offers.splice(+v, 1); S.quests.push(q); },
  ovquests: () => { S.ov = 'quests'; S.qconfirm = undefined; },
  qcancel: v => { const q = S.quests[+v]; if (!q || q.done) return; if (S.qconfirm !== +v) { S.qconfirm = +v; return; } const fee = cancelFee(q); if (S.gold < fee) return; S.gold -= fee; questFail(q, true); S.qconfirm = undefined; toast(`Missie geannuleerd: ${q.title}. Borg kwijt, ${fee} goud boete, Gebroken Eed.`); },
  leave: () => { S.town = null; nextRegion(); },
  equip: v => equip(+v), scrap: v => scrap(+v), sell: v => sell(+v), buy: v => buy(+v),
  shoptab: v => { S.ctx.tab = v; },
  evc: v => resolveChoice(+v), evnext: () => eventContinue(),
  kist: v => chestTry(v),
  mimicatk: () => { const c = S.ctx; startFight(['mimic'], { kind: 'elite', est: { kwetsbaar: 2, neergeslagen: 1 }, bonus: c.type === 'verguld' ? 2 : 1, intro: 'Je slaat toe voordat hij zijn bek kan openen.', ret: c.ret }); },
  kamp: v => campDo(v), kampslot: v => { S.ctx.slot = v; },
  schrijn: v => shrineDo(v),
  ovinv: () => { S.ov = 'inv'; S.invTab = 'eq'; }, ovchar: () => { S.ov = 'char'; }, ovskill: () => { S.ov = 'skill'; },
  ovclose: () => { S.ov = null; },
  invtab: v => { S.invTab = v; },
  pt: v => { if (S.p.pts > 0) { S.p.pts--; S.p[v]++; const t = stats(); if (v === 'vit') S.p.hp += 5; if (v === 'int') S.p.mp += 3; clampVitals(); } },
  learn: v => { if (v) S.p.skills.push(v); else S.p.pts += 2; S.p.picks--; S.pickOpts = null; if (S.p.picks <= 0) S.ov = null; },
  menu: () => { S.ov = 'menu'; MENU_CONFIRM = false; },
  totitle: () => { S.ov = null; VIEW = 'title'; },
  abandon: () => { if (!MENU_CONFIRM) { MENU_CONFIRM = true; return; } MENU_CONFIRM = false; M.deaths++; saveMeta(); store.del(RUN_KEY); S = null; VIEW = 'title'; },
  endtitle: () => { S = null; VIEW = 'title'; }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.a]; if (!fn) return;
  TOAST = null;
  fn(b.dataset.v);
  if (S) save();
  render();
});

// overlay 'menu' via S.ov
const _render = render;
render = function () {
  if (VIEW === 'codexview') { hud(); return rCodex(); }
  if (VIEW === 'run' && S && S.ov === 'menu') { hud(); return rMenuInline(); }
  _render();
};

render();
</script>
</body>
</html>
